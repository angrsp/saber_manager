name: saber_manager
description: "A Flutter app for managing OpenCore-based lightsabers"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  
  # State Management
  provider: ^6.1.1
  
  # USB Serial Communication
  usb_serial: ^0.5.0
  permission_handler: ^11.0.1
  
  # File Management
  path_provider: ^2.1.1
  
  # Utils - vibrazione rimossa temporaneamente per compatibilità
  # flutter_vibrate: ^1.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true